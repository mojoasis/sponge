# Air 配置文件 - Go 热重载工具配置
#:schema https://json.schemastore.org/any.json

# 项目根目录
root = "."
# 测试数据目录
testdata_dir = "testdata"
# 临时文件目录
tmp_dir = "tmp"

[build]
# 二进制文件启动参数
args_bin = []
# 编译后的二进制文件存放位置（Windows 下加 .exe）
bin = "tmp\\main.exe"

# 核心改动：
# 自动化指令流：1.生成wire代码 -> 2.生成swagger文档 -> 3.编译程序
cmd = "make all"

# 构建延迟时间（毫秒）
delay = 1000
# 排除的目录列表
exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs"] # 必须排除 docs
# 排除的文件列表
exclude_file = []
# 排除的正则表达式模式
exclude_regex = ["_test.go"]
# 排除未改变的文件
exclude_unchanged = false
# 跟随符号链接
follow_symlink = false
# 完整的二进制执行命令
full_bin = ""
# 包含的目录列表
include_dir = []
# 监听的文件扩展名
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"] # 加入 yaml 监听配置变化
# 包含的文件列表
include_file = []
# 杀死延迟时间
kill_delay = "0s"
# 构建错误日志文件
log = "build-errors.log"
# 是否使用轮询方式监控文件变化
poll = false
# 轮询间隔时间
poll_interval = 0
# 构建后执行的命令列表
post_cmd = []
# 构建前执行的命令列表
pre_cmd = []
# 是否重新运行
rerun = false
# 重新运行延迟时间
rerun_delay = 500
# 发送中断信号
send_interrupt = false
# 构建出错时是否停止
stop_on_error = true # 建议改为 true，编译错误时停止运行，方便看日志

[color]
# 应用输出颜色
app = ""
# 构建输出颜色
build = "yellow"
# 主程序输出颜色
main = "magenta"
# 运行器输出颜色
runner = "green"
# 监听器输出颜色
watcher = "cyan"

[log]
# 仅主程序输出日志
main_only = false
# 静默模式（不输出日志）
silent = false
# 日志是否包含时间戳
time = false

[misc]
# 退出时清理临时目录
clean_on_exit = true # 退出时清理 tmp 目录

[screen]
# 重新构建时清空屏幕
clear_on_rebuild = true # 重启时清空终端屏幕，日志更干净
# 保持滚动位置
keep_scroll = true
